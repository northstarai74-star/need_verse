<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account - Nnedverse</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--panel:#15181d;--panel2:#1b1f26;--line:#262b34;--text:#f4f1ec;--muted:#8e97a6;--accent:#ff4d1a;--ok:#3ddc84;--bad:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);background:var(--panel);padding:20px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:800 1.7rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;cursor:pointer}
.logo b{color:var(--accent)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;transition:.2s}
.btn:hover{background:#ff7a3d}
.btn.ghost{background:transparent;border:1px solid var(--line)}

main{padding:40px 0}
.grid{display:grid;grid-template-columns:1fr 2fr;gap:24px}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.sidebar h3{margin-top:0;font-size:1.1rem}
.sidebar p{margin:0;color:var(--muted);font-size:.9rem}
.content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);transition:.2s}
.tab.active{border-bottom-color:var(--accent);color:var(--text)}

.section{display:none}
.section.active{display:block}

.form-group{margin:14px 0}
.form-group label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.form-group input{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
.form-group input:focus{border-color:var(--accent)}

.order{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.order h4{margin:0 0 8px;font-size:.95rem}
.order p{margin:4px 0;font-size:.85rem;color:var(--muted)}

.empty{text-align:center;padding:40px;color:var(--muted)}

.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:2rem;color:#fff}

@media (max-width:720px){.grid{grid-template-columns:1fr}.sidebar{order:2}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="logo" onclick="location.href='/'"><i>N</i>Nnedverse</div>
  <button class="btn ghost" onclick="logout()">Sign out</button>
</div></header>

<main class="wrap">
  <div class="grid">
    <div class="sidebar">
      <div class="profile-header">
        <div class="avatar">👤</div>
        <div>
          <h3 id="userName">User Name</h3>
          <p id="userEmail">user@example.com</p>
        </div>
      </div>
      <div style="margin-top:20px">
        <p><b>Member since</b></p>
        <p id="joinDate" style="color:var(--text)">Oct 1, 2024</p>
      </div>
    </div>

    <div class="content">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('profile')">Profile</div>
        <div class="tab" onclick="switchTab('orders')">Orders</div>
        <div class="tab" onclick="switchTab('wishlist')">Wishlist</div>
      </div>

      <!-- Profile Tab -->
      <div id="profile" class="section active">
        <h2 style="margin-top:0">Account Settings</h2>
        <form id="profileForm">
          <div class="form-group">
            <label>Full name</label>
            <input id="profileName" type="text" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input id="profileEmail" type="email" disabled>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input id="profilePhone" type="tel">
          </div>
          <button type="submit" class="btn">Save Changes</button>
        </form>
      </div>

      <!-- Orders Tab -->
      <div id="orders" class="section">
        <h2 style="margin-top:0">Order History</h2>
        <div id="ordersList"></div>
      </div>

      <!-- Wishlist Tab -->
      <div id="wishlist" class="section">
        <h2 style="margin-top:0">Wishlist</h2>
        <div id="wishlistList"></div>
      </div>
    </div>
  </div>
</main>

<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const $=id=>document.getElementById(id);

// Check auth
const user=store.get("currentUser",null);
if(!user){location.href="/auth.html";throw new Error("Not authenticated")}

// Load user data
const users=store.get("users",[]);
const userData=users.find(u=>u.id===user.id)||{};
$("userName").textContent=user.name;
$("userEmail").textContent=user.email;
$("profileName").value=user.name;
$("profileEmail").value=user.email;
$("profilePhone").value=user.phone||"";
$("joinDate").textContent=new Date(userData.createdAt).toLocaleDateString("en-IN",{year:"numeric",month:"long",day:"numeric"});

// Tabs
function switchTab(tab){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  $(tab).classList.add("active");
  event.target.classList.add("active");
}

// Profile save
$("profileForm").onsubmit=e=>{e.preventDefault();
  const userIdx=users.findIndex(u=>u.id===user.id);
  if(userIdx>=0){
    users[userIdx].name=$("profileName").value;
    users[userIdx].phone=$("profilePhone").value;
    store.set("users",users);
    store.set("currentUser",{...user,name:$("profileName").value,phone:$("profilePhone").value});
    alert("Profile updated!");
  }
};

// Orders
const ordersList=$("ordersList");
if(userData.orders&&userData.orders.length){
  ordersList.innerHTML=userData.orders.map(o=>`<div class="order">
    <h4>#${o.ref}</h4>
    <p>Amount: ₹${o.amount}</p>
    <p>Status: ${o.status} | Fulfillment: ${o.fulfillment}</p>
    <p>${new Date(o.date).toLocaleDateString("en-IN")}</p>
  </div>`).join("");
}else{
  ordersList.innerHTML='<div class="empty">No orders yet.<br><a href="/" style="color:var(--accent);text-decoration:underline">Start shopping</a></div>';
}

// Wishlist
const wishlistList=$("wishlistList");
if(userData.wishlist&&userData.wishlist.length){
  wishlistList.innerHTML=userData.wishlist.map(item=>`<div class="order">
    <h4>${item}</h4>
    <p><button class="btn" style="padding:6px 12px;font-size:.85rem">View Product</button></p>
  </div>`).join("");
}else{
  wishlistList.innerHTML='<div class="empty">Your wishlist is empty.</div>';
}

function logout(){
  store.set("currentUser",null);
  location.href="/";
}
</script>
</body>
</html>
