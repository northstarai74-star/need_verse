<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - Nnedverse</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--panel:#15181d;--panel2:#1b1f26;--line:#262b34;--text:#f4f1ec;--muted:#8e97a6;--accent:#ff4d1a;--accent2:#ff7a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:40px;font:800 2rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.logo b{color:var(--accent)}

.form-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px}
.form-box h2{margin:0 0 6px;font:800 1.8rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.form-box p{margin:0 0 24px;color:var(--muted);font-size:.95rem}

.form-group{margin:18px 0}
.form-group label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.form-group input{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;outline:0;font:inherit;color:inherit}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,77,26,.15)}

.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s;margin-top:20px}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toggle{text-align:center;margin-top:20px;color:var(--muted);font-size:.9rem}
.toggle a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.toggle a:hover{color:var(--accent2)}

.error{background:rgba(255,92,92,.15);border:1px solid rgba(255,92,92,.3);color:#ff5c5c;padding:12px 16px;border-radius:10px;font-size:.9rem;margin-bottom:16px}
.success{background:rgba(61,220,132,.15);border:1px solid rgba(61,220,132,.3);color:#3ddc84;padding:12px 16px;border-radius:10px;font-size:.9rem;margin-bottom:16px}

.form-group input[type="email"]::placeholder,
.form-group input[type="password"]::placeholder,
.form-group input[type="text"]::placeholder{color:var(--muted)}

.back{margin-bottom:20px}
.back a{color:var(--accent);text-decoration:none;font-size:.9rem;font-weight:600}
.back a:hover{color:var(--accent2)}

@media (max-width:480px){.form-box{padding:24px}}
</style>
</head>
<body>

<div class="container">
  <div class="logo"><i>N</i>Nnedverse</div>

  <div id="loginForm" class="form-box">
    <h2>Welcome back</h2>
    <p>Sign in to your account to track orders and manage your preferences.</p>
    <div id="loginError" class="error" style="display:none"></div>
    <form id="loginFields">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="toggle">Don't have an account? <a onclick="switchForm()">Sign up</a></div>
  </div>

  <div id="signupForm" class="form-box" style="display:none">
    <h2>Join Nnedverse</h2>
    <p>Create an account to enjoy exclusive offers and faster checkout.</p>
    <div id="signupError" class="error" style="display:none"></div>
    <form id="signupFields">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signupName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="signupPhone" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" id="signupConfirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <div class="toggle">Already have an account? <a onclick="switchForm()">Sign in</a></div>
  </div>
</div>

<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

function switchForm(){
  document.getElementById("loginForm").style.display=document.getElementById("loginForm").style.display==="none"?"block":"none";
  document.getElementById("signupForm").style.display=document.getElementById("signupForm").style.display==="none"?"block":"none";
  document.getElementById("loginError").style.display="none";
  document.getElementById("signupError").style.display="none";
}

document.getElementById("loginFields").onsubmit=e=>{
  e.preventDefault();
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;
  const users=store.get("users",[]);
  const user=users.find(u=>u.email===email&&u.password===password);

  if(!user){
    document.getElementById("loginError").textContent="Invalid email or password";
    document.getElementById("loginError").style.display="block";
    return;
  }

  store.set("currentUser",{id:user.id,name:user.name,email:user.email,phone:user.phone});
  window.location.href="/";
};

document.getElementById("signupFields").onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim().toLowerCase();
  const phone=document.getElementById("signupPhone").value.trim();
  const password=document.getElementById("signupPassword").value;
  const confirm=document.getElementById("signupConfirm").value;

  if(!name||!email||!password){
    document.getElementById("signupError").textContent="Please fill in all required fields";
    document.getElementById("signupError").style.display="block";
    return;
  }

  if(password.length<6){
    document.getElementById("signupError").textContent="Password must be at least 6 characters";
    document.getElementById("signupError").style.display="block";
    return;
  }

  if(password!==confirm){
    document.getElementById("signupError").textContent="Passwords don't match";
    document.getElementById("signupError").style.display="block";
    return;
  }

  const users=store.get("users",[]);
  if(users.find(u=>u.email===email)){
    document.getElementById("signupError").textContent="This email is already registered";
    document.getElementById("signupError").style.display="block";
    return;
  }

  const newUser={
    id:"user_"+Date.now(),
    name,email,phone,password,
    createdAt:new Date().toISOString(),
    orders:[],wishlist:[]
  };

  users.push(newUser);
  store.set("users",users);
  store.set("currentUser",{id:newUser.id,name:newUser.name,email:newUser.email,phone:newUser.phone});

  window.location.href="/";
};

// Redirect if already logged in
if(store.get("currentUser"))window.location.href="/";
</script>
</body>
</html>
