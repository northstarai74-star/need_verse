<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--panel:#15181d;--line:#262b34;--text:#f4f1ec;--muted:#8e97a6;--accent:#f06000;--bad:#ff5c5c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
h1{margin:0 0 4px;font:800 2rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase}h1 b{color:var(--accent)}
label{display:block;margin-top:14px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{display:block;width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font:inherit;outline:0}
input:focus{border-color:var(--accent)}button{margin-top:20px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}.err{color:var(--bad);min-height:1.3em;margin:12px 0 0;font-size:.9rem}.muted{color:var(--muted);font-size:.88rem;margin:0}
</style>
</head>
<body>
<form id="f">
  <h1>Needverse <b>Admin</b></h1>
  <p class="muted">Sign in to manage orders, products and customers.</p>
  <label>Username<input name="username" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <label id="codeRow">Authenticator code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code (if 2FA is on)"></label>
  <p class="err" id="err" role="alert"></p>
  <button>Sign in</button>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const b = e.target.querySelector("button"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/admin/signin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Sign in failed");
    location.reload();
  } catch (x) { err.textContent = x.message; b.disabled = false; }
};
</script>
</body>
</html>
